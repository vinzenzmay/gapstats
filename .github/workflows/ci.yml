name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

jobs:
  # ── Build + test ─────────────────────────────────────────────────────────────
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git describe returns a real tag

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest

      - name: Build
        run: pixi run build

      - name: Test
        run: pixi run test

  # ── Coverage ─────────────────────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest

      - name: Build with coverage instrumentation
        run: pixi run build-cov

      - name: Run tests
        run: pixi run test-cov

      - name: Generate lcov report
        run: pixi run coverage

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: build-pixi-cov/coverage.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

[workspace]
name = "gapstats"
version = "0.1.0"
description = "Alignment gap & fragment-length QC statistics for BAM/CRAM files"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
# Build toolchain
cmake       = ">=3.16"
make        = ">=4"
git         = ">=2"
pkg-config  = "*"
c-compiler  = "*"
cxx-compiler = "*"

# Runtime + htslib build dependencies (htslib is auto-detected when available)
htslib      = ">=1.20"
zlib        = "*"
bzip2       = "*"
xz          = "*"          # liblzma
libcurl     = "*"
libdeflate  = "*"

# Test coverage
lcov        = "*"

[tasks]
# ── Normal build ──────────────────────────────────────────────────────────────
# Use build-pixi/ so this dir stays isolated from the standalone build/ dir.
# CMAKE_PREFIX_PATH=$CONDA_PREFIX makes cmake prefer conda-provided libraries
# (curl, zlib, htslib, etc.) over system libraries — critical inside pixi.
configure = "cmake -B build-pixi -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$CONDA_PREFIX"
build     = { cmd = "cmake --build build-pixi --parallel", depends-on = ["configure"] }
test      = { cmd = "ctest --test-dir build-pixi --output-on-failure", depends-on = ["build"] }
install   = { cmd = "cmake --install build-pixi --prefix $CONDA_PREFIX", depends-on = ["build"] }
clean     = "rm -rf build-pixi build-pixi-cov"

# ── Coverage build ────────────────────────────────────────────────────────────
configure-cov = "cmake -B build-pixi-cov -DCMAKE_BUILD_TYPE=Debug -DCOVERAGE=ON -DCMAKE_PREFIX_PATH=$CONDA_PREFIX"
build-cov     = { cmd = "cmake --build build-pixi-cov --parallel", depends-on = ["configure-cov"] }
test-cov      = { cmd = "ctest --test-dir build-pixi-cov --output-on-failure", depends-on = ["build-cov"] }
coverage      = { cmd = "cmake --build build-pixi-cov --target coverage", depends-on = ["test-cov"] }
